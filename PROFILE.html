html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;

h1{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;margin:2px 0 4px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:11px}
.lab{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);margin:0 0 9px}

  color:var(--txt);padding:9px 10px;font-size:14px;font-family:inherit}

.sbox{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:9px 6px;text-align:center}
.sbox .v{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;line-height:1}
.sbox .k{font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;

td{padding:7px 5px;border-bottom:1px solid #22314b;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px}

.chartwrap{position:relative;height:220px;margin-top:6px}

<script>
let sb = null;
let pitchers = [], outings = [], CACHE = {}; // outingId -> pitches
let currentPitcherId = null;

function setSync(state, msg){
  document.getElementById("syncDot").className = "dot"+(state?" "+state:"");
  document.getElementById("syncMsg").textContent = msg;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init(){
  if(SUPABASE_URL.startsWith("PASTE_") || SUPABASE_ANON_KEY.startsWith("PASTE_")){
    setSync("err","Supabase not configured — edit SUPABASE_URL / SUPABASE_ANON_KEY at the top of this file.");
    return;
  }
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.rpc("list_pitchers");
    if(error) throw error;
    pitchers = data || [];
    setSync("ok","Connected");
    document.getElementById("pitcherPicker").innerHTML =
      '<option value="">— select a pitcher —</option>' +
      pitchers.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
  }catch(e){ setSync("err","Connection failed: "+(e.message||e)); }
}

function renderShareLink(){
  const box = document.getElementById("shareLinkBox");
  if(!box) return;
  const p = pitchers.find(x=>x.id===currentPitcherId);
  if(!p || !p.share_token){ box.innerHTML = ""; return; }
  const base = location.href.replace(/PROFILE\.html.*$/i, "");
  const link = base + "REPORT.html?token=" + p.share_token;
  box.innerHTML = `
    <label style="font-size:11px;color:#8b9cb5;text-transform:uppercase;letter-spacing:.06em;font-weight:600">
      Client report link — send only this pitcher this exact link
    </label>
    <input readonly value="${esc(link)}" onclick="this.select()" style="margin-top:5px;font-family:'JetBrains Mono',monospace;font-size:11.5px">
  `;
}

async function onPitcherChange(){
  currentPitcherId = document.getElementById("pitcherPicker").value;
  document.getElementById("deletePitcherBtn").style.display = currentPitcherId ? "block" : "none";
  if(!currentPitcherId){ outings=[]; renderOutingPicker(); renderShareLink(); return; }
  setSync("busy","Loading outings…");
  const { data, error } = await sb.rpc("get_pitcher_outings", {p_pitcher_id: currentPitcherId});
  if(error){ setSync("err","Load failed: "+error.message); return; }
  outings = (data || []).slice().sort((a,b)=> a.date<b.date?1:-1);
  CACHE = {};
  for(const o of outings){
    const { data: pitches, error: pErr } = await sb.rpc("get_outing_pitches", {p_outing_id: o.id});
    if(!pErr) CACHE[o.id] = pitches || [];
  }
  setSync("ok","Loaded "+outings.length+" outing(s)");
  renderOutingPicker();
  renderOuting();
  renderProfile();
  renderShareLink();
}

async function deletePitcher(){
  const p = pitchers.find(x=>x.id===currentPitcherId);
  if(!p) return;
  const typed = prompt(`This permanently deletes ${p.name} and every outing, pitch, and report you've logged for them. This cannot be undone.\n\nType the pitcher's name exactly to confirm:`);
  if(typed === null) return;
  if(typed.trim() !== p.name){ alert("Name didn't match — nothing was deleted."); return; }
  setSync("busy","Deleting…");
  const { error } = await sb.rpc("delete_pitcher", {p_id: p.id});
  if(error){ setSync("err","Delete failed: "+error.message); return; }
  pitchers = pitchers.filter(x=>x.id!==p.id);
  document.getElementById("pitcherPicker").innerHTML =
    '<option value="">— select a pitcher —</option>' +
    pitchers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
  currentPitcherId = null;
  outings = []; CACHE = {};
  document.getElementById("deletePitcherBtn").style.display = "none";
  renderOutingPicker(); renderOuting(); renderProfile(); renderShareLink();
  setSync("ok", `${p.name} deleted.`);
}

function renderOutingPicker(){
  const sel = document.getElementById("outingPicker");
  sel.innerHTML = outings.map(o=>`<option value="${o.id}">${o.date} vs ${esc(o.opponent||"")}</option>`).join("");
}

function showTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
  document.getElementById("tab-"+name).classList.add("on");
  event.target.classList.add("on");
  if(name==="profile") renderProfile();
}

/* ---------- PA reconstruction (mirrors CHART.html's live-count logic) ---------- */
function buildPAs(rows){
  const pas = [];
  let current = null, b=0, s=0;
  rows.forEach(r=>{
    const p = {pitch:r.pitch, res:r.result, zone:r.zone, velo:r.velo, batter:r.batter, hand:r.hand, bip:r.bip_type, bipRes:r.bip_result};
    if(current && p.batter !== current.batter){ current.outcome="incomplete"; pas.push(current); current=null; }
    if(!current){ current = {batter:p.batter, hand:p.hand, pitches:[]}; b=0; s=0; }
    p._bBefore=b; p._sBefore=s;
    if(p.res==="Ball") b++;
    else if(p.res==="Called"||p.res==="Whiff") s++;
    else if(p.res==="Foul" && s<2) s++;
    p._bAfter=b; p._sAfter=s;
    current.pitches.push(p);
    const terminal = p.res==="InPlay"||p.res==="HBP"||s>=3||b>=4;
    if(terminal){ current.outcome = paOutcome(p,s,b); pas.push(current); current=null; }
  });
  if(current){ current.outcome="incomplete"; pas.push(current); }
  return pas;
}
function paOutcome(last, s, b){
  if(last.res==="InPlay") return last.bipRes || "InPlay";
  if(last.res==="HBP") return "HBP";
  if(s>=3) return last.res==="Whiff" ? "K (swinging)" : "K (looking)";
  if(b>=4) return "BB";
  return "incomplete";
}
function isOutOutcome(o){ return o==="Out" || o==="DP" || o==="K (swinging)" || o==="K (looking)"; }

/* Catcher's-view location label for a zone code. Vertical/horizontal only —
   no in/away claim, since that depends on pitcher handedness which isn't tracked. */
function zoneLabel(z){
  if(z==null) return "—";
  const inner = {1:"Up-L",2:"Up-Mid",3:"Up-R",4:"Mid-L",5:"Heart",6:"Mid-R",7:"Low-L",8:"Low-Mid",9:"Low-R"};
  const outer = {11:"Up-L chase",12:"Up-R chase",13:"Low-L chase",14:"Low-R chase"};
  return inner[z] || outer[z] || "—";
}

/* Batted-ball profile per pitch: GB/LD/FB/PU rates and hard-hit rate among balls in play. */
function battedBallProfile(rowsOrPitches, codes){
  return codes.map(code=>{
    const bip = rowsOrPitches.filter(p=>p.pitch===code && (p.result||p.res)==="InPlay");
    const type = t => bip.filter(p=>(p.bip||p.bip_type)===t).length;
    const gb=type("GB"), ld=type("LD"), fb=type("FB"), pu=type("PU");
    const hard = bip.filter(p=>(p.hard)==="Y").length;
    const outs = bip.filter(p=>{ const r=p.bipRes||p.bip_result; return r==="Out"||r==="DP"; }).length;
    return {
      code, n:bip.length,
      gbPct: bip.length?Math.round(gb/bip.length*100):null,
      ldPct: bip.length?Math.round(ld/bip.length*100):null,
      fbPct: bip.length?Math.round(fb/bip.length*100):null,
      puPct: bip.length?Math.round(pu/bip.length*100):null,
      hardPct: bip.length?Math.round(hard/bip.length*100):null,
      outPct: bip.length?Math.round(outs/bip.length*100):null
    };
  }).filter(r=>r.n>0);
}

/* Sequence paths that get a hitter to their first 2-strike count, and what happens after. */
function pathsToTwoStrikes(pas){
  const paths = {};
  pas.forEach(pa=>{
    let idx = -1;
    for(let i=0;i<pa.pitches.length;i++){
      if(pa.pitches[i]._sAfter===2 && pa.pitches[i]._sBefore<2){ idx = i; break; }
    }
    if(idx<0) return; // never reached 2 strikes this PA
    const path = pa.pitches.slice(0, idx+1).map(p=>p.pitch).join("-");
    if(!paths[path]) paths[path] = {n:0, k:0, totalLen:0};
    paths[path].n++;
    paths[path].totalLen += pa.pitches.length;
    if(pa.outcome==="K (swinging)" || pa.outcome==="K (looking)") paths[path].k++;
  });
  return Object.entries(paths).map(([path,v])=>({
    path, n:v.n, kPct: Math.round(v.k/v.n*100), avgLen: (v.totalLen/v.n).toFixed(1)
  })).sort((a,b)=>b.n-a.n);
}

/* Sequence analysis for a subset of PAs (e.g. one batter handedness).
   Tracks not just whiff%, but true out-creation rate: how often the second
   pitch of the sequence was the pitch that actually ended the PA in an out. */
function sequenceAnalysis(pas, minN){
  const seq = {};
  pas.forEach(pa=>{
    for(let i=1;i<pa.pitches.length;i++){
      const prev = pa.pitches[i-1].pitch, cur = pa.pitches[i];
      const key = prev+" → "+cur.pitch;
      if(!seq[key]) seq[key] = {n:0, whiff:0, loc:{}, outEnd:0};
      seq[key].n++;
      if(cur.res==="Whiff") seq[key].whiff++;
      const lbl = zoneLabel(cur.zone);
      seq[key].loc[lbl] = (seq[key].loc[lbl]||0) + 1;
      const isLastPitch = (i === pa.pitches.length-1);
      if(isLastPitch && isOutOutcome(pa.outcome)) seq[key].outEnd++;
    }
  });
  const rows = Object.entries(seq).map(([k,v])=>{
    const topLoc = Object.entries(v.loc).sort((a,b)=>b[1]-a[1])[0];
    return {
      key:k, n:v.n, whiffPct: Math.round(v.whiff/v.n*100), outPct: Math.round(v.outEnd/v.n*100),
      topLoc: topLoc?topLoc[0]:"—", topLocPct: topLoc?Math.round(topLoc[1]/v.n*100):0
    };
  });
  const qualified = rows.filter(r=>r.n>=minN).sort((a,b)=>b.n-a.n);
  const stock = qualified.length ? qualified[0] : null;
  const bestOut = qualified.length ? qualified.slice().sort((a,b)=>b.outPct-a.outPct)[0] : null;
  return {stock, bestOut, all: qualified};
}

/* ---------- outing report ---------- */
function renderOuting(){
  const body = document.getElementById("outingBody");
  if(!outings.length){ body.innerHTML = '<p class="empty">No outings for this pitcher yet.</p>'; return; }
  const oid = document.getElementById("outingPicker").value || outings[0].id;
  const rows = CACHE[oid];
  if(!rows){ body.innerHTML = '<p class="empty">Loading…</p>'; return; }
  const pas = buildPAs(rows);

  const codes = [...new Set(rows.map(p=>p.pitch))];
  const usage = codes.map(code=>{
    const ps = rows.filter(p=>p.pitch===code);
    const inZone = ps.filter(p=>p.zone>=1&&p.zone<=9).length;
    const outZone = ps.filter(p=>p.zone>=11&&p.zone<=14).length;
    const swings = ps.filter(p=>["Whiff","Foul","InPlay"].includes(p.result)).length;
    const whiffs = ps.filter(p=>p.result==="Whiff").length;
    const chaseSw = ps.filter(p=>p.zone>=11&&p.zone<=14&&["Whiff","Foul","InPlay"].includes(p.result)).length;
    const velos = ps.map(p=>p.velo).filter(v=>v!=null);
    const avgV = velos.length ? (velos.reduce((a,b)=>a+b,0)/velos.length) : null;
    return {code, n:ps.length, zonePct: ps.length?Math.round(inZone/ps.length*100):0,
      whiffPct: swings? Math.round(whiffs/swings*100):null,
      chasePct: outZone? Math.round(chaseSw/outZone*100):null,
      avgV: avgV!=null? avgV.toFixed(1):"—"};
  }).sort((a,b)=>b.n-a.n);

  const outPAs = pas.filter(pa=>isOutOutcome(pa.outcome));
  const outByPitch = {};
  outPAs.forEach(pa=>{ const last = pa.pitches[pa.pitches.length-1]; outByPitch[last.pitch]=(outByPitch[last.pitch]||0)+1; });
  const outRows = Object.entries(outByPitch).sort((a,b)=>b[1]-a[1]);

  const dpCount = pas.filter(pa=>pa.outcome==="DP").length;

  const contact = battedBallProfile(rows, codes);
  const twoStrikePaths = pathsToTwoStrikes(pas).filter(p=>p.n>=2).slice(0,8);

  const seq = {};
  pas.forEach(pa=>{
    for(let i=1;i<pa.pitches.length;i++){
      const prev = pa.pitches[i-1].pitch, cur = pa.pitches[i];
      const key = prev+" → "+cur.pitch;
      if(!seq[key]) seq[key] = {n:0, whiff:0, foul:0, called:0, ball:0, inplay:0, loc:{}, locWhiff:{}};
      seq[key].n++;
      if(cur.res==="Whiff") seq[key].whiff++;
      else if(cur.res==="Foul") seq[key].foul++;
      else if(cur.res==="Called") seq[key].called++;
      else if(cur.res==="Ball") seq[key].ball++;
      else if(cur.res==="InPlay") seq[key].inplay++;
      const lbl = zoneLabel(cur.zone);
      seq[key].loc[lbl] = (seq[key].loc[lbl]||0) + 1;
      if(cur.res==="Whiff") seq[key].locWhiff[lbl] = (seq[key].locWhiff[lbl]||0) + 1;
    }
  });
  const seqRows = Object.entries(seq).filter(([k,v])=>v.n>=2).sort((a,b)=>b[1].n-a[1].n).slice(0,10);
  seqRows.forEach(([k,v])=>{
    const topLoc = Object.entries(v.loc).sort((a,b)=>b[1]-a[1])[0];
    v.topLoc = topLoc ? topLoc[0] : "—";
    v.topLocPct = topLoc ? Math.round(topLoc[1]/v.n*100) : 0;
    v.topLocWhiffPct = topLoc && v.locWhiff[topLoc[0]] ? Math.round(v.locWhiff[topLoc[0]]/topLoc[1]*100) : 0;
  });

  const outcomeTally = {};
  pas.forEach(pa=>{ outcomeTally[pa.outcome]=(outcomeTally[pa.outcome]||0)+1; });

  const totalPitches = rows.length;
  const totalPAs = pas.filter(pa=>pa.outcome!=="incomplete").length;
  const strikes = rows.filter(p=>["Called","Whiff","Foul","InPlay"].includes(p.result)).length;

  body.innerHTML = `
    <div class="card"><p class="lab">Snapshot</p>
      <div class="sgrid">
        <div class="sbox"><div class="v">${totalPitches}</div><div class="k">Pitches</div></div>
        <div class="sbox"><div class="v">${totalPAs}</div><div class="k">PA faced</div></div>
        <div class="sbox"><div class="v">${totalPitches?Math.round(strikes/totalPitches*100):0}%</div><div class="k">Strike %</div></div>
        <div class="sbox"><div class="v">${dpCount}</div><div class="k">Double plays</div></div>
      </div></div>
    <div class="card"><p class="lab">Arsenal usage &amp; effectiveness</p>
      <table><thead><tr><th>Pitch</th><th>N</th><th>Zone%</th><th>Whiff%</th><th>Chase%</th><th>Avg V</th></tr></thead>
      <tbody>${usage.map(u=>`<tr><td class="pcode">${esc(u.code)}</td><td>${u.n}</td><td>${u.zonePct}%</td>
        <td>${u.whiffPct==null?"—":u.whiffPct+"%"}</td><td>${u.chasePct==null?"—":u.chasePct+"%"}</td><td>${u.avgV}</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><p class="lab">Out creation — which pitch ended it</p>
      ${outRows.length? `<table><thead><tr><th>Pitch</th><th>Outs/K</th></tr></thead>
      <tbody>${outRows.map(([code,n])=>`<tr><td class="pcode">${esc(code)}</td><td>${n}</td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">No completed outs logged yet this outing.</p>'}</div>
    <div class="card"><p class="lab">Contact quality — batted balls by pitch</p>
      ${contact.length? `<table><thead><tr><th>Pitch</th><th>BIP</th><th>GB%</th><th>LD%</th><th>FB%</th><th>PU%</th><th>Hard%</th><th>Out%</th></tr></thead>
      <tbody>${contact.map(c=>`<tr><td class="pcode">${esc(c.code)}</td><td>${c.n}</td><td>${c.gbPct}%</td><td>${c.ldPct}%</td><td>${c.fbPct}%</td><td>${c.puPct}%</td><td>${c.hardPct}%</td><td>${c.outPct}%</td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">No balls in play logged yet this outing.</p>'}</div>
    <div class="card"><p class="lab">Top sequences — pitch &amp; typical location (min. 2 uses)</p>
      ${seqRows.length? `<table><thead><tr><th>Sequence</th><th>N</th><th>Whiff%</th><th>Typical spot</th><th>Whiff% there</th></tr></thead>
      <tbody>${seqRows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td>
        <td>${Math.round(v.whiff/v.n*100)}%</td><td>${esc(v.topLoc)} (${v.topLocPct}%)</td><td>${v.topLocWhiffPct}%</td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">Not enough multi-pitch PAs yet to show sequences.</p>'}</div>
    <div class="card"><p class="lab">Paths to two strikes (min. 2 uses)</p>
      ${twoStrikePaths.length? `<table><thead><tr><th>Path</th><th>N</th><th>K%</th><th>Avg PA length</th></tr></thead>
      <tbody>${twoStrikePaths.map(p=>`<tr><td>${esc(p.path)}</td><td>${p.n}</td><td>${p.kPct}%</td><td>${p.avgLen}</td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">Not enough PAs reached two strikes yet this outing.</p>'}</div>
    <div class="card"><p class="lab">PA outcomes</p>
      ${Object.entries(outcomeTally).map(([k,v])=>`<span class="pill">${esc(k)}: ${v}</span>`).join("")}</div>
  `;
}

/* ---------- career profile ---------- */
let trendChart = null;
function renderProfile(){
  const body = document.getElementById("profileBody");
  if(!outings.length){ body.innerHTML = '<p class="empty">No outings for this pitcher yet.</p>'; return; }

  const outingsSorted = [...outings].sort((a,b)=> a.date<b.date?-1:1);
  let allPAs = [];
  outingsSorted.forEach(o=> allPAs = allPAs.concat(buildPAs(CACHE[o.id]||[])));
  const allRows = [];
  outingsSorted.forEach(o=> (CACHE[o.id]||[]).forEach(r=>allRows.push(r)));

  const codes = [...new Set(allRows.map(p=>p.pitch))];
  const totalPitches = allRows.length;
  const usage = codes.map(code=>{
    const ps = allRows.filter(p=>p.pitch===code);
    return {code, n:ps.length, pct: Math.round(ps.length/totalPitches*100)};
  }).sort((a,b)=>b.n-a.n);

  const outPAs = allPAs.filter(pa=>isOutOutcome(pa.outcome));
  const outByPitch = {};
  outPAs.forEach(pa=>{ const last = pa.pitches[pa.pitches.length-1]; outByPitch[last.pitch]=(outByPitch[last.pitch]||0)+1; });
  const topOutPitch = Object.entries(outByPitch).sort((a,b)=>b[1]-a[1])[0];
  const dpCount = allPAs.filter(pa=>pa.outcome==="DP").length;

  // put-away rate computed directly from PA pitch objects (which carry _sBefore)
  const paPitches = [];
  allPAs.forEach(pa=>pa.pitches.forEach(p=>paPitches.push(p)));
  const twoStrikePitches = paPitches.filter(p=>p._sBefore===2);
  const putAway = codes.map(code=>{
    const ps = twoStrikePitches.filter(p=>p.pitch===code);
    const wh = ps.filter(p=>p.res==="Whiff").length;
    return {code, n:ps.length, pct: ps.length? Math.round(wh/ps.length*100):null};
  }).filter(r=>r.n>0).sort((a,b)=>b.pct-a.pct);

  const careerContact = battedBallProfile(allRows, codes);
  const careerPaths = pathsToTwoStrikes(allPAs).filter(p=>p.n>=3).slice(0,8);

  const pasVsL = allPAs.filter(pa=>pa.hand==="L");
  const pasVsR = allPAs.filter(pa=>pa.hand==="R");
  const seqVsL = sequenceAnalysis(pasVsL, 3);
  const seqVsR = sequenceAnalysis(pasVsR, 3);

  const seq = {};
  allPAs.forEach(pa=>{
    for(let i=1;i<pa.pitches.length;i++){
      const prev = pa.pitches[i-1].pitch, cur = pa.pitches[i];
      const key = prev+" → "+cur.pitch;
      if(!seq[key]) seq[key] = {n:0, whiff:0, loc:{}, locWhiff:{}};
      seq[key].n++;
      if(cur.res==="Whiff") seq[key].whiff++;
      const lbl = zoneLabel(cur.zone);
      seq[key].loc[lbl] = (seq[key].loc[lbl]||0) + 1;
      if(cur.res==="Whiff") seq[key].locWhiff[lbl] = (seq[key].locWhiff[lbl]||0) + 1;
    }
  });
  const bestSeq = Object.entries(seq).filter(([k,v])=>v.n>=4)
    .sort((a,b)=> (b[1].whiff/b[1].n)-(a[1].whiff/a[1].n)).slice(0,6);
  bestSeq.forEach(([k,v])=>{
    const topLoc = Object.entries(v.loc).sort((a,b)=>b[1]-a[1])[0];
    v.topLoc = topLoc ? topLoc[0] : "—";
    v.topLocPct = topLoc ? Math.round(topLoc[1]/v.n*100) : 0;
  });

  body.innerHTML = `
    <div class="card"><p class="lab">Career snapshot</p>
      <div class="sgrid">
        <div class="sbox"><div class="v">${outings.length}</div><div class="k">Outings</div></div>
        <div class="sbox"><div class="v">${totalPitches}</div><div class="k">Pitches</div></div>
        <div class="sbox"><div class="v">${topOutPitch?esc(topOutPitch[0]):"—"}</div><div class="k">Top out pitch</div></div>
        <div class="sbox"><div class="v">${dpCount}</div><div class="k">Career DPs</div></div>
      </div></div>
    <div class="card"><p class="lab">Arsenal mix (career)</p>
      <table><thead><tr><th>Pitch</th><th>N</th><th>%</th></tr></thead>
      <tbody>${usage.map(u=>`<tr><td class="pcode">${esc(u.code)}</td><td>${u.n}</td><td>${u.pct}%</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><p class="lab">Put-away rate (2-strike whiff%)</p>
      ${putAway.length? `<table><thead><tr><th>Pitch</th><th>N</th><th>Whiff%</th></tr></thead>
      <tbody>${putAway.map(u=>`<tr><td class="pcode">${esc(u.code)}</td><td>${u.n}</td><td>${u.pct==null?"—":u.pct+"%"}</td></tr>`).join("")}</tbody></table>`
      :'<p class="empty">No 2-strike pitches logged yet.</p>'}</div>
    <div class="card"><p class="lab">Contact quality — batted balls by pitch (career)</p>
      ${careerContact.length? `<table><thead><tr><th>Pitch</th><th>BIP</th><th>GB%</th><th>LD%</th><th>FB%</th><th>PU%</th><th>Hard%</th><th>Out%</th></tr></thead>
      <tbody>${careerContact.map(c=>`<tr><td class="pcode">${esc(c.code)}</td><td>${c.n}</td><td>${c.gbPct}%</td><td>${c.ldPct}%</td><td>${c.fbPct}%</td><td>${c.puPct}%</td><td>${c.hardPct}%</td><td>${c.outPct}%</td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">No balls in play logged yet.</p>'}</div>
    <div class="card"><p class="lab">Season trend</p>
      <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <select id="trendPitch" onchange="drawTrend()">${codes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
        <select id="trendMetric" onchange="drawTrend()">
          <option value="whiff">Whiff%</option>
          <option value="zone">Zone%</option>
          <option value="chase">Chase%</option>
          <option value="gb">GB% (of BIP)</option>
          <option value="hard">Hard-hit% (of BIP)</option>
        </select>
      </div>
      <div class="chartwrap"><canvas id="trendCanvas"></canvas></div></div>
    <div class="card"><p class="lab">Best sequences — pitch &amp; typical location (min. 4 uses, by whiff%)</p>
      ${bestSeq.length? `<table><thead><tr><th>Sequence</th><th>N</th><th>Whiff%</th><th>Typical spot</th></tr></thead>
      <tbody>${bestSeq.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${Math.round(v.whiff/v.n*100)}%</td><td>${esc(v.topLoc)} (${v.topLocPct}%)</td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">Not enough repeated sequences yet.</p>'}</div>
    <div class="card"><p class="lab">Paths to two strikes (career, min. 3 uses)</p>
      ${careerPaths.length? `<table><thead><tr><th>Path</th><th>N</th><th>K%</th><th>Avg PA length</th></tr></thead>
      <tbody>${careerPaths.map(p=>`<tr><td>${esc(p.path)}</td><td>${p.n}</td><td>${p.kPct}%</td><td>${p.avgLen}</td></tr>`).join("")}</tbody></table>`
      : '<p class="empty">Not enough PAs reached two strikes yet.</p>'}</div>
    <div class="card"><p class="lab">Sequencing vs. LHB (career, min. 3 uses)</p>${handednessBlockHTML(seqVsL)}</div>
    <div class="card"><p class="lab">Sequencing vs. RHB (career, min. 3 uses)</p>${handednessBlockHTML(seqVsR)}</div>
  `;
  drawTrend();
}
function handednessBlockHTML(sa){
  if(!sa.all.length) return '<p class="empty">Not enough same-handedness PAs logged yet.</p>';
  const stockLine = sa.stock ? `<span class="pill">Stock: ${esc(sa.stock.key)} (n=${sa.stock.n}, thrown most)</span>` : "";
  const outLine = sa.bestOut ? `<span class="pill">Best out-creator: ${esc(sa.bestOut.key)} (${sa.bestOut.outPct}% out rate, n=${sa.bestOut.n})</span>` : "";
  const rows = sa.all.slice(0,8);
  return `
    <div style="margin-bottom:10px">${stockLine} ${outLine}</div>
    <table><thead><tr><th>Sequence</th><th>N</th><th>Whiff%</th><th>Out%</th><th>Typical spot</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.key)}</td><td>${r.n}</td><td>${r.whiffPct}%</td><td>${r.outPct}%</td><td>${esc(r.topLoc)} (${r.topLocPct}%)</td></tr>`).join("")}</tbody></table>
  `;
}
function drawTrend(){
  const sel = document.getElementById("trendPitch");
  const metricSel = document.getElementById("trendMetric");
  if(!sel) return;
  const code = sel.value;
  const metric = metricSel ? metricSel.value : "whiff";
  const metricLabel = {whiff:"Whiff%", zone:"Zone%", chase:"Chase%", gb:"GB%", hard:"Hard-hit%"}[metric];
  const outingsSorted = [...outings].sort((a,b)=> a.date<b.date?-1:1);
  const labels = [], data = [];
  outingsSorted.forEach(o=>{
    const ps = (CACHE[o.id]||[]).filter(p=>p.pitch===code);
    if(!ps.length) return;
    let val = 0;
    if(metric==="whiff"){
      const sw = ps.filter(p=>["Whiff","Foul","InPlay"].includes(p.result)).length;
      const wh = ps.filter(p=>p.result==="Whiff").length;
      val = sw? Math.round(wh/sw*100):0;
    } else if(metric==="zone"){
      const inZone = ps.filter(p=>p.zone>=1&&p.zone<=9).length;
      val = Math.round(inZone/ps.length*100);
    } else if(metric==="chase"){
      const outZone = ps.filter(p=>p.zone>=11&&p.zone<=14);
      const chaseSw = outZone.filter(p=>["Whiff","Foul","InPlay"].includes(p.result)).length;
      val = outZone.length? Math.round(chaseSw/outZone.length*100):0;
    } else if(metric==="gb"){
      const bip = ps.filter(p=>p.result==="InPlay");
      const gb = bip.filter(p=>p.bip_type==="GB").length;
      val = bip.length? Math.round(gb/bip.length*100):0;
    } else if(metric==="hard"){
      const bip = ps.filter(p=>p.result==="InPlay");
      const hard = bip.filter(p=>p.hard==="Y").length;
      val = bip.length? Math.round(hard/bip.length*100):0;
    }
    labels.push(o.date); data.push(val);
  });
  const ctx = document.getElementById("trendCanvas");
  if(trendChart) trendChart.destroy();
  if(!ctx || !window.Chart) return;
  trendChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ label: code+" "+metricLabel, data, borderColor:'#3d8fd1', backgroundColor:'rgba(61,143,209,.15)',
      tension:.25, fill:true, pointRadius:3 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y:{ beginAtZero:true, max:100, ticks:{color:'#8b9cb5'}, grid:{color:'#2c405f'} },
               x:{ ticks:{color:'#8b9cb5'}, grid:{color:'#22314b'} } },
      plugins:{ legend:{ labels:{ color:'#eef2f7' } } } }
  });
}

init();
</script>
</body>
</html>
