<style>
:root{
  --bg:#09090b; --surf:#131316; --surf2:#1c1c21; --line:#2a2a30;
  --txt:#f5f4f2; --sub:#8c8a92; --accent:#ff2140; --accent2:#ff6a8a; --amb:#ffc94d; --iron:#2a2a30;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(ellipse at 50% -10%, #16090c 0%, #09090b 60%);

.wrap{max-width:760px;margin:0 auto;background:var(--surf);border-radius:6px;overflow:hidden;

.wrap::before,.wrap::after,.foot::before,.foot::after{content:"";position:absolute;width:14px;height:14px;

.wrap::before{top:10px;left:10px;border-left:2px solid var(--accent)}
.wrap::after{top:10px;right:10px;border-left:none;border-right:2px solid var(--accent)}
.foot{position:relative}
.foot::before,.foot::after{border-top:none;border-bottom:2px solid var(--accent)}

.pick{max-width:760px;margin:0 auto 16px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px}
.pick select,.pick input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);

.pick label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.1em;font-weight:600;font-family:'Chakra Petch',sans-serif}

.head .kicker{font-family:'Chakra Petch',sans-serif;font-size:13px;letter-spacing:.42em;text-transform:uppercase;

.head h1{font-family:'Chakra Petch',sans-serif;font-size:40px;font-weight:700;margin:10px 0 6px;letter-spacing:.01em;
  color:var(--txt);text-shadow:0 0 24px #ff214044}
.head .meta{font-size:13px;color:var(--sub);font-family:'JetBrains Mono',monospace}
.head .asof{margin-top:12px;font-size:10.5px;color:#5c5a62;letter-spacing:.06em}

.section{padding:26px 30px;border-bottom:1px solid var(--line);background:var(--surf)}
.section:last-child{border-bottom:none}
.section h2{font-family:'Chakra Petch',sans-serif;font-size:19px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);margin:0 0 16px;border-bottom:1px solid var(--accent);
  display:inline-block;padding-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:14px 8px;text-align:center}
.kpi .v{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--txt)}
.kpi .k{font-size:9.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:'Chakra Petch',sans-serif;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:600;
  text-align:right;padding:0 8px 8px;border-bottom:1px solid var(--line)}
th:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--txt)}
td:first-child{text-align:left;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:16px;letter-spacing:.02em;color:var(--accent)}

.badgebar{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:var(--surf2);border:1px solid var(--line);color:var(--accent2);

.chartwrap{position:relative;height:220px;margin-top:4px}

.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
.foot{padding:16px 30px;font-size:10.5px;color:var(--sub);text-align:center;background:var(--bg);

.printbar button{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:6px;padding:9px 16px;

.empty{text-align:center;color:var(--sub);padding:30px;font-size:14px;background:var(--surf)}

  .wrap{box-shadow:none;border-radius:0}

}

<script>
let sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qparam(name){ return new URLSearchParams(location.search).get(name); }

async function boot(){
  const token = qparam("token");
  if(!token){
    document.getElementById("report").innerHTML = '<div class="empty">This report link is invalid or missing. Ask your coach for the correct link.</div>';
    return;
  }
  document.getElementById("report").innerHTML = '<div class="empty">Loading…</div>';
  const { data, error } = await sb.rpc("get_report", {p_token: token});
  if(error || !data){
    document.getElementById("report").innerHTML = '<div class="empty">This report link is invalid or has expired. Ask your coach for the correct link.</div>';
    return;
  }
  buildReportFromPayload(data);
}

/* ---- PA reconstruction, same rules as the charting tool ---- */
function buildPAs(rows){
  const pas = [];
  let current = null, b=0, s=0;
  rows.forEach(r=>{
    const p = {pitch:r.pitch, res:r.result, zone:r.zone, velo:r.velo, batter:r.batter, hand:r.hand, bip:r.bip_type, bipRes:r.bip_result, hard:r.hard};
    if(current && p.batter !== current.batter){ current.outcome="incomplete"; pas.push(current); current=null; }
    if(!current){ current = {batter:p.batter, hand:p.hand, pitches:[]}; b=0; s=0; }
    p._bBefore=b; p._sBefore=s;
    if(p.res==="Ball") b++;
    else if(p.res==="Called"||p.res==="Whiff") s++;
    else if(p.res==="Foul" && s<2) s++;
    p._sAfter=s;
    current.pitches.push(p);
    const terminal = p.res==="InPlay"||p.res==="HBP"||s>=3||b>=4;
    if(terminal){ current.outcome = paOutcome(p,s,b); pas.push(current); current=null; }
  });
  if(current){ current.outcome="incomplete"; pas.push(current); }
  return pas;
}
function paOutcome(last, s, b){
  if(last.res==="InPlay") return last.bipRes || "InPlay";
  if(last.res==="HBP") return "HBP";
  if(s>=3) return last.res==="Whiff" ? "K (swinging)" : "K (looking)";
  if(b>=4) return "BB";
  return "incomplete";
}
function isOutOutcome(o){ return o==="Out" || o==="DP" || o==="K (swinging)" || o==="K (looking)"; }
function zoneLabel(z, hand){
  if(z==null) return "—";
  if(z===5) return "Heart";
  const row = {1:"Up",2:"Up",3:"Up",4:"Thigh",6:"Thigh",7:"Low",8:"Low",9:"Low",11:"Up",12:"Up",13:"Low",14:"Low"}[z];
  const side = {1:"L",2:"Mid",3:"R",4:"L",6:"R",7:"L",8:"Mid",9:"R",11:"L",12:"R",13:"L",14:"R"}[z];
  const chase = z>=11 ? " chase" : "";
  if(side==="Mid") return row+"-Middle"+chase;
  let horiz;
  if(hand==="L") horiz = side==="L" ? "In" : "Away";
  else if(hand==="R") horiz = side==="R" ? "In" : "Away";
  else horiz = side;
  return row+"-"+horiz+chase;
}
function zoneGridPos(z){
  const pos = {
    1:{row:1,col:1}, 2:{row:1,col:2}, 3:{row:1,col:3},
    4:{row:2,col:1}, 5:{row:2,col:2}, 6:{row:2,col:3},
    7:{row:3,col:1}, 8:{row:3,col:2}, 9:{row:3,col:3},
    11:{row:0,col:0}, 12:{row:0,col:4}, 13:{row:4,col:0}, 14:{row:4,col:4}
  };
  return pos[z] || null;
}
function renderZoneGridHTML(markers){
  let cells = "";
  for(let r=0;r<5;r++){
    for(let c=0;c<5;c++){
      const inZone = r>=1 && r<=3 && c>=1 && c<=3;
      const here = markers.filter(m=>{ const p=zoneGridPos(m.zone); return p && p.row===r && p.col===c; });
      let content = "";
      if(here.length){
        content = here.map(m=>`<div style="background:${m.color};color:#000;border-radius:3px;padding:1px 3px;font-size:8.5px;font-weight:700;font-family:'JetBrains Mono',monospace;margin:1px;white-space:nowrap;box-shadow:0 0 6px ${m.color}99">${esc(m.label)}</div>`).join("");
      }
      const crossLines = (!here.length && inZone && (r===2 || c===2)) ? `
        ${r===2 ? '<div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#ff214033"></div>' : ''}
        ${c===2 ? '<div style="position:absolute;top:0;bottom:0;left:50%;width:1px;background:#ff214033"></div>' : ''}
      ` : "";
      cells += `<div style="position:relative;aspect-ratio:1;border:1px solid ${inZone?'#5c1f2c':'#2a2a30'};background:${inZone?'#1a0c0f':'#0d0d0f'};display:flex;align-items:center;justify-content:center;flex-wrap:wrap;border-radius:2px;overflow:hidden">${crossLines}${content}</div>`;
    }
  }
  return `<div style="position:relative;max-width:280px;margin:10px auto 4px;padding:10px;border:1px solid #2a2a30;border-radius:4px;background:#0a0a0c">
    <div style="position:absolute;top:4px;left:4px;width:10px;height:10px;border-top:2px solid #ff2140;border-left:2px solid #ff2140"></div>
    <div style="position:absolute;top:4px;right:4px;width:10px;height:10px;border-top:2px solid #ff2140;border-right:2px solid #ff2140"></div>
    <div style="position:absolute;bottom:4px;left:4px;width:10px;height:10px;border-bottom:2px solid #ff2140;border-left:2px solid #ff2140"></div>
    <div style="position:absolute;bottom:4px;right:4px;width:10px;height:10px;border-bottom:2px solid #ff2140;border-right:2px solid #ff2140"></div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:3px">${cells}</div>
  </div>
    <p class="note" style="text-align:center;letter-spacing:.04em">PITCHER'S-EYE VIEW · CENTER BOX IS THE STRIKE ZONE</p>`;
}
function battedBallProfile(rows, codes){
  return codes.map(code=>{
    const bip = rows.filter(p=>p.pitch===code && p.result==="InPlay");
    const type = t => bip.filter(p=>p.bip_type===t).length;
    const gb=type("GB"), ld=type("LD"), fb=type("FB"), pu=type("PU");
    const hard = bip.filter(p=>p.hard==="Y").length;
    const outs = bip.filter(p=>p.bip_result==="Out"||p.bip_result==="DP").length;
    return {
      code, n:bip.length,
      gbPct: bip.length?Math.round(gb/bip.length*100):null,
      ldPct: bip.length?Math.round(ld/bip.length*100):null,
      fbPct: bip.length?Math.round(fb/bip.length*100):null,
      puPct: bip.length?Math.round(pu/bip.length*100):null,
      hardPct: bip.length?Math.round(hard/bip.length*100):null,
      outPct: bip.length?Math.round(outs/bip.length*100):null
    };
  }).filter(r=>r.n>0);
}
function pathsToTwoStrikes(pas){
  const paths = {};
  pas.forEach(pa=>{
    let idx = -1;
    for(let i=0;i<pa.pitches.length;i++){
      if(pa.pitches[i]._sAfter===2 && pa.pitches[i]._sBefore<2){ idx = i; break; }
    }
    if(idx<0) return;
    const path = pa.pitches.slice(0, idx+1).map(p=>p.pitch).join("-");
    if(!paths[path]) paths[path] = {n:0, k:0, totalLen:0};
    paths[path].n++;
    paths[path].totalLen += pa.pitches.length;
    if(pa.outcome==="K (swinging)" || pa.outcome==="K (looking)") paths[path].k++;
  });
  return Object.entries(paths).map(([path,v])=>({
    path, n:v.n, kPct: Math.round(v.k/v.n*100), avgLen: (v.totalLen/v.n).toFixed(1)
  })).sort((a,b)=>b.n-a.n);
}
function countBucketStats(pas, predicate, preferInZone){
  const pitches = [];
  pas.forEach(pa=>pa.pitches.forEach(p=>{ if(predicate(p)) pitches.push(p); }));
  const codes = [...new Set(pitches.map(p=>p.pitch))];
  return codes.map(code=>{
    const ps = pitches.filter(p=>p.pitch===code);
    const strikeN = ps.filter(p=>["Called","Whiff","Foul","InPlay"].includes(p.res)).length;
    const whiffN = ps.filter(p=>p.res==="Whiff").length;
    const bip = ps.filter(p=>p.res==="InPlay");
    const hardN = bip.filter(p=>p.hard==="Y").length;
    const outN = bip.filter(p=>p.bipRes==="Out"||p.bipRes==="DP").length;
    let locSource = ps;
    if(preferInZone){
      const inZoneOnly = ps.filter(p=>p.zone>=1 && p.zone<=9);
      if(inZoneOnly.length) locSource = inZoneOnly;
    }
    const loc = {};
    locSource.forEach(p=>{ if(p.zone!=null) loc[p.zone]=(loc[p.zone]||0)+1; });
    const topZoneEntry = Object.entries(loc).sort((a,b)=>b[1]-a[1])[0];
    const topZone = topZoneEntry ? +topZoneEntry[0] : null;
    const topZoneHand = topZone!=null ? ((locSource.find(p=>p.zone===topZone)||{}).hand) : null;
    return {
      code, n:ps.length,
      strikePct: Math.round(strikeN/ps.length*100),
      whiffPct: Math.round(whiffN/ps.length*100),
      hardPct: bip.length ? Math.round(hardN/bip.length*100) : null,
      outPct: bip.length ? Math.round(outN/bip.length*100) : null,
      bipN: bip.length,
      topZone: topZone,
      topZoneLabel: topZone!=null ? zoneLabel(topZone, topZoneHand) : "—"
    };
  }).filter(r=>r.n>0);
}
const isStrike1 = p => p._bBefore===0 && p._sBefore===0;
const isMidCount = p => !(p._bBefore===0 && p._sBefore===0) && p._sBefore<2;
const isTwoStrike = p => p._sBefore===2;
function pickRecommendation(stats, minN, scoreFn){
  const qualified = stats.filter(r=>r.n>=minN);
  if(!qualified.length) return {best:null, table: stats.sort((a,b)=>b.n-a.n)};
  const ranked = qualified.slice().sort((a,b)=> scoreFn(b)-scoreFn(a));
  return {best: ranked[0], table: stats.slice().sort((a,b)=>b.n-a.n)};
}

function sequenceAnalysis(pas, minN){
  const seq = {};
  pas.forEach(pa=>{
    for(let i=1;i<pa.pitches.length;i++){
      const prev = pa.pitches[i-1].pitch, cur = pa.pitches[i];
      const key = prev+" → "+cur.pitch;
      if(!seq[key]) seq[key] = {n:0, whiff:0, loc:{}, locZone:{}, outEnd:0, endPitch:cur.pitch};
      seq[key].n++;
      if(cur.res==="Whiff") seq[key].whiff++;
      const lbl = zoneLabel(cur.zone, cur.hand);
      seq[key].loc[lbl] = (seq[key].loc[lbl]||0) + 1;
      if(cur.zone!=null) seq[key].locZone[cur.zone] = (seq[key].locZone[cur.zone]||0) + 1;
      const isLastPitch = (i === pa.pitches.length-1);
      if(isLastPitch && isOutOutcome(pa.outcome)) seq[key].outEnd++;
    }
  });
  const rows = Object.entries(seq).map(([k,v])=>{
    const topLoc = Object.entries(v.loc).sort((a,b)=>b[1]-a[1])[0];
    const topLocZone = Object.entries(v.locZone).sort((a,b)=>b[1]-a[1])[0];
    return {
      key:k, n:v.n, whiffPct: Math.round(v.whiff/v.n*100), outPct: Math.round(v.outEnd/v.n*100),
      topLoc: topLoc?topLoc[0]:"—", topLocPct: topLoc?Math.round(topLoc[1]/v.n*100):0,
      topLocZone: topLocZone?+topLocZone[0]:null, endPitch: v.endPitch
    };
  });
  const qualified = rows.filter(r=>r.n>=minN).sort((a,b)=>b.n-a.n);
  const stock = qualified.length ? qualified[0] : null;
  const bestOut = qualified.length ? qualified.slice().sort((a,b)=>b.outPct-a.outPct)[0] : null;
  return {stock, bestOut, all: qualified};
}
function attackPlanBlockHTML(pas, color){
  if(!pas.length) return '<p class="note">Not enough same-handedness data logged yet to build a plan.</p>';

  const strike1Stats = countBucketStats(pas, isStrike1, true);
  const midStats = countBucketStats(pas, isMidCount, true);
  const twoStrikeStats = countBucketStats(pas, isTwoStrike, false);

  const strike1 = pickRecommendation(strike1Stats, 3, r => r.strikePct - (r.hardPct||0)*0.5);
  const mid = pickRecommendation(midStats, 3, r => r.whiffPct + (r.hardPct!=null ? (100-r.hardPct)*0.15 : 0));
  const twoStrike = pickRecommendation(twoStrikeStats, 2, r => r.whiffPct*0.6 + (r.outPct||0)*0.4);

  const markers = [];
  if(strike1.best && strike1.best.topZone!=null) markers.push({zone:strike1.best.topZone, label:strike1.best.code+" 1st", color:"#ff9aa8"});
  if(mid.best && mid.best.topZone!=null) markers.push({zone:mid.best.topZone, label:mid.best.code+" mid", color:"#ffc94d"});
  if(twoStrike.best && twoStrike.best.topZone!=null) markers.push({zone:twoStrike.best.topZone, label:twoStrike.best.code+" fin", color});
  const grid = renderZoneGridHTML(markers);

  const bucketTable = (title, r) => r.table.length ? `
    <p class="note" style="font-weight:700;margin-top:12px">${title}</p>
    <table><thead><tr><th>Pitch</th><th>N</th><th>Strike%</th><th>Whiff%</th><th>Hard%</th><th>Out%</th></tr></thead>
    <tbody>${r.table.map(t=>`<tr${r.best && t.code===r.best.code?' style="color:'+color+';font-weight:700"':''}><td>${esc(t.code)}</td><td>${t.n}</td><td>${t.strikePct}%</td><td>${t.whiffPct}%</td><td>${t.hardPct==null?"—":t.hardPct+"%"}</td><td>${t.outPct==null?"—":t.outPct+"%"}</td></tr>`).join("")}</tbody></table>
  ` : "";

  return `
    ${grid}
    <div style="margin-top:8px">
      ${strike1.best? `<p class="note" style="margin:4px 0"><b>Strike 1, limit damage:</b> ${esc(strike1.best.code)} — ${strike1.best.strikePct}% strike rate${strike1.best.hardPct!=null?`, ${strike1.best.hardPct}% hard-hit on contact`:""}, typically ${esc(strike1.best.topZoneLabel)}.</p>` : ""}
      ${mid.best? `<p class="note" style="margin:4px 0"><b>Mid-count, draw a swing:</b> ${esc(mid.best.code)} — ${mid.best.whiffPct}% whiff, typically ${esc(mid.best.topZoneLabel)}.</p>` : ""}
      ${twoStrike.best? `<p class="note" style="margin:4px 0"><b>Two strikes, finish it:</b> ${esc(twoStrike.best.code)} — ${twoStrike.best.whiffPct}% whiff${twoStrike.best.outPct!=null?`, ${twoStrike.best.outPct}% out rate on contact`:""}, typically ${esc(twoStrike.best.topZoneLabel)}.</p>` : ""}
    </div>
    ${bucketTable("Strike 1 options", strike1)}
    ${bucketTable("Mid-count options", mid)}
    ${bucketTable("Two-strike finish options", twoStrike)}
  `;
}
function handednessBlockHTML(sa){
  if(!sa.all.length) return '<p class="note">Not enough same-handedness PAs logged yet.</p>';
  const stockLine = sa.stock ? `<span class="badge">Stock: ${esc(sa.stock.key)} (n=${sa.stock.n})</span>` : "";
  const outLine = sa.bestOut ? `<span class="badge">Best out-creator: ${esc(sa.bestOut.key)} (${sa.bestOut.outPct}% out rate, n=${sa.bestOut.n})</span>` : "";
  return `<div class="badgebar" style="margin-bottom:10px">${stockLine}${outLine}</div>`;
}

let trendChart = null;
function buildReportFromPayload(payload){
  const pitcher = payload.pitcher;
  const outings = (payload.outings || []).slice().sort((a,b)=> a.date<b.date?-1:1);
  if(!outings.length){
    document.getElementById("report").innerHTML = '<div class="empty">No outings logged for this pitcher yet.</div>';
    return;
  }
  const CACHE = payload.pitches || {}; // outing_id -> pitches[]

  let allPAs = [];
  outings.forEach(o=> allPAs = allPAs.concat(buildPAs(CACHE[o.id]||[])));
  const allRows = [];
  outings.forEach(o=> (CACHE[o.id]||[]).forEach(r=>allRows.push(r)));

  const codes = [...new Set(allRows.map(p=>p.pitch))];
  const totalPitches = allRows.length;
  const strikes = allRows.filter(p=>["Called","Whiff","Foul","InPlay"].includes(p.result)).length;

  const usage = codes.map(code=>{
    const ps = allRows.filter(p=>p.pitch===code);
    const inZone = ps.filter(p=>p.zone>=1&&p.zone<=9).length;
    const outZone = ps.filter(p=>p.zone>=11&&p.zone<=14).length;
    const swings = ps.filter(p=>["Whiff","Foul","InPlay"].includes(p.result)).length;
    const whiffs = ps.filter(p=>p.result==="Whiff").length;
    const chaseSw = ps.filter(p=>p.zone>=11&&p.zone<=14&&["Whiff","Foul","InPlay"].includes(p.result)).length;
    const velos = ps.map(p=>p.velo).filter(v=>v!=null);
    const avgV = velos.length ? (velos.reduce((a,b)=>a+b,0)/velos.length) : null;
    return {code, n:ps.length, pct: Math.round(ps.length/totalPitches*100),
      zonePct: ps.length?Math.round(inZone/ps.length*100):0,
      whiffPct: swings? Math.round(whiffs/swings*100):null,
      chasePct: outZone? Math.round(chaseSw/outZone*100):null,
      avgV: avgV!=null? avgV.toFixed(1):"—"};
  }).sort((a,b)=>b.n-a.n);

  const outPAs = allPAs.filter(pa=>isOutOutcome(pa.outcome));
  const outByPitch = {};
  outPAs.forEach(pa=>{ const last = pa.pitches[pa.pitches.length-1]; outByPitch[last.pitch]=(outByPitch[last.pitch]||0)+1; });
  const topOutPitch = Object.entries(outByPitch).sort((a,b)=>b[1]-a[1])[0];
  const dpCount = allPAs.filter(pa=>pa.outcome==="DP").length;
  const kCount = allPAs.filter(pa=>pa.outcome==="K (swinging)"||pa.outcome==="K (looking)").length;

  const paPitches = [];
  allPAs.forEach(pa=>pa.pitches.forEach(p=>paPitches.push(p)));
  const twoStrikePitches = paPitches.filter(p=>p._sBefore===2);
  const putAway = codes.map(code=>{
    const ps = twoStrikePitches.filter(p=>p.pitch===code);
    const wh = ps.filter(p=>p.res==="Whiff").length;
    return {code, n:ps.length, pct: ps.length? Math.round(wh/ps.length*100):null};
  }).filter(r=>r.n>0).sort((a,b)=>b.pct-a.pct);

  const contact = battedBallProfile(allRows, codes);
  const twoStrikePaths = pathsToTwoStrikes(allPAs).filter(p=>p.n>=3).slice(0,6);
  const pasVsL = allPAs.filter(pa=>pa.hand==="L");
  const pasVsR = allPAs.filter(pa=>pa.hand==="R");
  const seqVsL = sequenceAnalysis(pasVsL, 3);
  const seqVsR = sequenceAnalysis(pasVsR, 3);

  const seq = {};
  allPAs.forEach(pa=>{
    for(let i=1;i<pa.pitches.length;i++){
      const prev = pa.pitches[i-1].pitch, cur = pa.pitches[i];
      const key = prev+" → "+cur.pitch;
      if(!seq[key]) seq[key] = {n:0, whiff:0, loc:{}};
      seq[key].n++;
      if(cur.res==="Whiff") seq[key].whiff++;
      const lbl = zoneLabel(cur.zone, cur.hand);
      seq[key].loc[lbl] = (seq[key].loc[lbl]||0) + 1;
    }
  });
  const bestSeq = Object.entries(seq).filter(([k,v])=>v.n>=4)
    .sort((a,b)=> (b[1].whiff/b[1].n)-(a[1].whiff/a[1].n)).slice(0,5);
  bestSeq.forEach(([k,v])=>{
    const topLoc = Object.entries(v.loc).sort((a,b)=>b[1]-a[1])[0];
    v.topLoc = topLoc ? topLoc[0] : "—";
  });

  const firstDate = outings[0].date, lastDate = outings[outings.length-1].date;
  const level = outings[outings.length-1].level || pitcher.level || "";

  document.getElementById("report").innerHTML = `
    <div class="head">
      <div class="kicker">Swirvin Analytics</div>
      <h1>${esc(pitcher.name)}</h1>
      <div class="meta">${esc(level)} · ${outings.length} outing${outings.length===1?"":"s"} tracked · ${esc(firstDate)} – ${esc(lastDate)}</div>
      <div class="asof">Compiled ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</div>
    </div>

    <div class="section">
      <h2>Overview</h2>
      <div class="kpis">
        <div class="kpi"><div class="v">${totalPitches}</div><div class="k">Pitches logged</div></div>
        <div class="kpi"><div class="v">${totalPitches?Math.round(strikes/totalPitches*100):0}%</div><div class="k">Strike rate</div></div>
        <div class="kpi"><div class="v">${kCount}</div><div class="k">Strikeouts</div></div>
        <div class="kpi"><div class="v">${dpCount}</div><div class="k">Double plays</div></div>
      </div>
    </div>

    <div class="section">
      <h2>Arsenal</h2>
      <table><thead><tr><th>Pitch</th><th>Usage</th><th>Zone%</th><th>Whiff%</th><th>Chase%</th><th>Avg Velo</th></tr></thead>
      <tbody>${usage.map(u=>`<tr><td>${esc(u.code)}</td><td>${u.pct}%</td><td>${u.zonePct}%</td>
        <td>${u.whiffPct==null?"—":u.whiffPct+"%"}</td><td>${u.chasePct==null?"—":u.chasePct+"%"}</td><td>${u.avgV}</td></tr>`).join("")}</tbody></table>
    </div>

    <div class="section">
      <h2>Put-away pitch (2-strike whiff rate)</h2>
      ${putAway.length? `<table><thead><tr><th>Pitch</th><th>Thrown</th><th>Whiff%</th></tr></thead>
      <tbody>${putAway.slice(0,5).map(u=>`<tr><td>${esc(u.code)}</td><td>${u.n}</td><td>${u.pct==null?"—":u.pct+"%"}</td></tr>`).join("")}</tbody></table>`
      : '<p class="note">Not enough 2-strike data yet.</p>'}
      ${topOutPitch?`<p class="note">Primary out pitch: <b>${esc(topOutPitch[0])}</b> (${topOutPitch[1]} outs/strikeouts finished with it).</p>`:""}
    </div>

    <div class="section">
      <h2>Contact quality</h2>
      ${contact.length? `<table><thead><tr><th>Pitch</th><th>BIP</th><th>GB%</th><th>LD%</th><th>FB%</th><th>PU%</th><th>Hard%</th><th>Out%</th></tr></thead>
      <tbody>${contact.map(c=>`<tr><td>${esc(c.code)}</td><td>${c.n}</td><td>${c.gbPct}%</td><td>${c.ldPct}%</td><td>${c.fbPct}%</td><td>${c.puPct}%</td><td>${c.hardPct}%</td><td>${c.outPct}%</td></tr>`).join("")}</tbody></table>`
      : '<p class="note">No balls in play logged yet.</p>'}
    </div>

    <div class="section">
      <h2>Signature sequences &amp; location</h2>
      ${bestSeq.length? `<div class="badgebar">${bestSeq.map(([k,v])=>`<span class="badge">${esc(k)} → ${esc(v.topLoc)} · ${Math.round(v.whiff/v.n*100)}% whiff (n=${v.n})</span>`).join("")}</div>`
      : '<p class="note">Not enough repeated sequences yet to surface a signature combo.</p>'}
    </div>

    <div class="section">
      <h2>Paths to two strikes</h2>
      ${twoStrikePaths.length? `<table><thead><tr><th>Path</th><th>N</th><th>K%</th><th>Avg PA length</th></tr></thead>
      <tbody>${twoStrikePaths.map(p=>`<tr><td>${esc(p.path)}</td><td>${p.n}</td><td>${p.kPct}%</td><td>${p.avgLen}</td></tr>`).join("")}</tbody></table>`
      : '<p class="note">Not enough PAs reached two strikes yet.</p>'}
    </div>

    <div class="section">
      <h2>Attack plan vs LHH</h2>
      ${attackPlanBlockHTML(pasVsL, "#ff2140")}
    </div>

    <div class="section">
      <h2>Attack plan vs RHH</h2>
      ${attackPlanBlockHTML(pasVsR, "#ff6a8a")}
    </div>

    <div class="section">
      <h2>Whiff% trend</h2>
      <select id="trendPitch" onchange="drawTrend()" style="max-width:160px;padding:8px;border:1px solid #2a2a30;border-radius:6px;font-family:'JetBrains Mono',monospace;background:#131316;color:#f5f4f2">
        ${codes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}
      </select>
      <div class="chartwrap"><canvas id="trendCanvas"></canvas></div>
    </div>

    <div class="foot">Compiled from self-charted video data · Swirvin Analytics · Private coaching report</div>
  `;

  window._REPORT_CACHE = CACHE;
  window._REPORT_OUTINGS = outings;
  drawTrend();
  document.getElementById("printBar").style.display = "flex";
}

function drawTrend(){
  const sel = document.getElementById("trendPitch");
  if(!sel) return;
  const code = sel.value;
  const outings = window._REPORT_OUTINGS, CACHE = window._REPORT_CACHE;
  const labels = [], data = [];
  outings.forEach(o=>{
    const ps = (CACHE[o.id]||[]).filter(p=>p.pitch===code);
    const sw = ps.filter(p=>["Whiff","Foul","InPlay"].includes(p.result)).length;
    const wh = ps.filter(p=>p.result==="Whiff").length;
    if(ps.length){ labels.push(o.date); data.push(sw? Math.round(wh/sw*100):0); }
  });
  const ctx = document.getElementById("trendCanvas");
  if(trendChart) trendChart.destroy();
  if(!ctx) return;
  if(!window.Chart){
    ctx.parentElement.innerHTML = '<p class="note">Chart library failed to load — check your connection and refresh. The underlying data is fine, this is just the graph renderer.</p>';
    return;
  }
  trendChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ label: code+" whiff%", data, borderColor:'#ff2140', backgroundColor:'rgba(255,33,64,.15)',
      tension:.25, fill:true, pointRadius:3, pointBackgroundColor:'#ff6a8a' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y:{ beginAtZero:true, max:100, ticks:{color:'#8c8a92'}, grid:{color:'#2a2a3055'} },
               x:{ ticks:{color:'#8c8a92'}, grid:{color:'#2a2a3033'} } },
      plugins:{ legend:{ display:false } } }
  });
}

boot();
</script>
</body>
</html>
