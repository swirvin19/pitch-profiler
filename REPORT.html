<style>
:root{
  --bg:#120b07; --leather:#241811; --leather2:#2e1f15; --paper:#f4ead4; --ink:#241812; --sub:#7a6a52;
  --line:#c9a86a55; --brass:#c9a227; --brass2:#8a6a1f; --rust:#8a3324; --iron:#3a3128;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse at 50% -10%, #2a1c12 0%, #120b07 60%),
    repeating-linear-gradient(135deg, rgba(0,0,0,.15) 0 2px, transparent 2px 6px);
  color:var(--paper);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  padding:22px 14px 60px}
.wrap{max-width:760px;margin:0 auto;background:var(--paper);border-radius:6px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 2px var(--brass2), 0 0 0 6px #120b07;
  position:relative;color:var(--ink)}
.wrap::before,.wrap::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e8cd7a, #8a6a1f 70%);
  box-shadow:0 1px 2px rgba(0,0,0,.6);top:10px;z-index:5}
.wrap::before{left:10px}
.wrap::after{right:10px}
.foot{position:relative}
.foot::before,.foot::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e8cd7a, #8a6a1f 70%);
  box-shadow:0 1px 2px rgba(0,0,0,.6);bottom:10px}
.foot::before{left:10px}
.foot::after{right:10px}

.pick{max-width:760px;margin:0 auto 16px;background:var(--leather);border:1px solid var(--brass2);border-radius:8px;padding:14px}
.pick select,.pick input{width:100%;background:#1a120b;border:1px solid var(--brass2);border-radius:6px;color:var(--paper);
  padding:9px 10px;font-size:14px;font-family:inherit;margin-top:6px}
.pick label{font-size:11px;color:#b8a988;text-transform:uppercase;letter-spacing:.1em;font-weight:600;font-family:'Bebas Neue',sans-serif}
.pick .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.pick .row > div{flex:1;min-width:160px}
.pick button{margin-top:10px;background:linear-gradient(180deg,#c9a227,#8a6a1f);border:1px solid #6b5117;color:#1a1206;
  font-weight:700;border-radius:6px;padding:10px 16px;cursor:pointer;font-size:13.5px;letter-spacing:.04em;
  font-family:'Bebas Neue',sans-serif;text-transform:uppercase}

.head{background:
    radial-gradient(ellipse at 50% 0%, #3a2417 0%, #1c130d 75%);
  color:var(--paper);padding:38px 30px 30px;text-align:center;position:relative;
  border-bottom:3px double var(--brass2)}
.head .kicker{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--brass);font-weight:400}
.head h1{font-family:'Rye',serif;font-size:42px;font-weight:400;margin:10px 0 6px;letter-spacing:.01em;
  color:#f4ead4;text-shadow:0 2px 0 #000, 0 1px 0 #6b5117}
.head .meta{font-size:13px;color:#c9b98f;font-family:'JetBrains Mono',monospace}
.head .asof{margin-top:12px;font-size:10.5px;color:#8a7a5c;letter-spacing:.06em}

.section{padding:26px 30px;border-bottom:1px solid var(--line);background:var(--paper)}
.section:last-child{border-bottom:none}
.section h2{font-family:'Bebas Neue',sans-serif;font-size:21px;font-weight:400;letter-spacing:.08em;
  text-transform:uppercase;color:var(--rust);margin:0 0 16px;border-bottom:2px solid var(--brass);
  display:inline-block;padding-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:radial-gradient(circle at 35% 30%, #ece0c4, #d8c69a 75%);
  border:1px solid var(--brass2);border-radius:10px;padding:14px 8px;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 3px rgba(0,0,0,.15)}
.kpi .v{font-family:'Rye',serif;font-size:24px;font-weight:400;color:var(--ink)}
.kpi .k{font-size:9.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:400;
  text-align:right;padding:0 8px 8px;border-bottom:2px solid var(--iron)}
th:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px}
td:first-child{text-align:left;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:17px;letter-spacing:.02em;color:var(--rust)}

.badgebar{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:linear-gradient(180deg,#3a2417,#241811);border:1px solid var(--brass2);color:var(--brass);
  border-radius:4px;padding:7px 13px;font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace}

.chartwrap{position:relative;height:220px;margin-top:4px}

.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
.foot{padding:16px 30px;font-size:10.5px;color:#c9b98f;text-align:center;background:#1c130d;
  letter-spacing:.1em;text-transform:uppercase;font-family:'Bebas Neue',sans-serif}

.printbar{max-width:760px;margin:0 auto 12px;display:flex;justify-content:flex-end}
.printbar button{background:linear-gradient(180deg,#c9a227,#8a6a1f);border:1px solid #6b5117;color:#1a1206;border-radius:6px;padding:9px 16px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;text-transform:uppercase}

.empty{text-align:center;color:var(--sub);padding:30px;font-size:14px;background:var(--paper)}

@media print{
  body{background:#fff;padding:0}
  .pick,.printbar,.rivet{display:none}
  .wrap{box-shadow:none;border-radius:0}
  .head{background:#1c130d !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<div class="printbar" id="printBar" style="display:none">
  <button onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="wrap" id="report">
  <div class="empty">This report link is invalid or missing. Ask your coach for the correct link.</div>
</div>

<script>
let sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qparam(name){ return new URLSearchParams(location.search).get(name); }

async function boot(){
  const token = qparam("token");
  if(!token){
    document.getElementById("report").innerHTML = '<div class="empty">This report link is invalid or missing. Ask your coach for the correct link.</div>';
    return;
  }
  document.getElementById("report").innerHTML = '<div class="empty">Loading…</div>';
  const { data, error } = await sb.rpc("get_report", {p_token: token});
  if(error || !data){
    document.getElementById("report").innerHTML = '<div class="empty">This report link is invalid or has expired. Ask your coach for the correct link.</div>';
    return;
  }
  buildReportFromPayload(data);
}

/* ---- PA reconstruction, same rules as the charting tool ---- */
function buildPAs(rows){
  const pas = [];
  let current = null, b=0, s=0;
  rows.forEach(r=>{
    const p = {pitch:r.pitch, res:r.result, zone:r.zone, velo:r.velo, batter:r.batter, hand:r.hand, bip:r.bip_type, bipRes:r.bip_result};
    if(current && p.batter !== current.batter){ current.outcome="incomplete"; pas.push(current); current=null; }
    if(!current){ current = {batter:p.batter, hand:p.hand, pitches:[]}; b=0; s=0; }
    p._sBefore=s;
    if(p.res==="Ball") b++;
    else if(p.res==="Called"||p.res==="Whiff") s++;
    else if(p.res==="Foul" && s<2) s++;
    p._sAfter=s;
    current.pitches.push(p);
    const terminal = p.res==="InPlay"||p.res==="HBP"||s>=3||b>=4;
    if(terminal){ current.outcome = paOutcome(p,s,b); pas.push(current); current=null; }
  });
  if(current){ current.outcome="incomplete"; pas.push(current); }
  return pas;
}
function paOutcome(last, s, b){
  if(last.res==="InPlay") return last.bipRes || "InPlay";
  if(last.res==="HBP") return "HBP";
  if(s>=3) return last.res==="Whiff" ? "K (swinging)" : "K (looking)";
  if(b>=4) return "BB";
  return "incomplete";
}
function isOutOutcome(o){ return o==="Out" || o==="DP" || o==="K (swinging)" || o==="K (looking)"; }
function zoneLabel(z){
  if(z==null) return "—";
  const inner = {1:"Up-L",2:"Up-Mid",3:"Up-R",4:"Mid-L",5:"Heart",6:"Mid-R",7:"Low-L",8:"Low-Mid",9:"Low-R"};
  const outer = {11:"Up-L chase",12:"Up-R chase",13:"Low-L chase",14:"Low-R chase"};
  return inner[z] || outer[z] || "—";
}
function battedBallProfile(rows, codes){
  return codes.map(code=>{
    const bip = rows.filter(p=>p.pitch===code && p.result==="InPlay");
    const type = t => bip.filter(p=>p.bip_type===t).length;
    const gb=type("GB"), ld=type("LD"), fb=type("FB"), pu=type("PU");
    const hard = bip.filter(p=>p.hard==="Y").length;
    const outs = bip.filter(p=>p.bip_result==="Out"||p.bip_result==="DP").length;
    return {
      code, n:bip.length,
      gbPct: bip.length?Math.round(gb/bip.length*100):null,
      ldPct: bip.length?Math.round(ld/bip.length*100):null,
      fbPct: bip.length?Math.round(fb/bip.length*100):null,
      puPct: bip.length?Math.round(pu/bip.length*100):null,
      hardPct: bip.length?Math.round(hard/bip.length*100):null,
      outPct: bip.length?Math.round(outs/bip.length*100):null
    };
  }).filter(r=>r.n>0);
}
function pathsToTwoStrikes(pas){
  const paths = {};
  pas.forEach(pa=>{
    let idx = -1;
    for(let i=0;i<pa.pitches.length;i++){
      if(pa.pitches[i]._sAfter===2 && pa.pitches[i]._sBefore<2){ idx = i; break; }
    }
    if(idx<0) return;
    const path = pa.pitches.slice(0, idx+1).map(p=>p.pitch).join("-");
    if(!paths[path]) paths[path] = {n:0, k:0, totalLen:0};
    paths[path].n++;
    paths[path].totalLen += pa.pitches.length;
    if(pa.outcome==="K (swinging)" || pa.outcome==="K (looking)") paths[path].k++;
  });
  return Object.entries(paths).map(([path,v])=>({
    path, n:v.n, kPct: Math.round(v.k/v.n*100), avgLen: (v.totalLen/v.n).toFixed(1)
  })).sort((a,b)=>b.n-a.n);
}
function sequenceAnalysis(pas, minN){
  const seq = {};
  pas.forEach(pa=>{
    for(let i=1;i<pa.pitches.length;i++){
      const prev = pa.pitches[i-1].pitch, cur = pa.pitches[i];
      const key = prev+" → "+cur.pitch;
      if(!seq[key]) seq[key] = {n:0, whiff:0, loc:{}, outEnd:0};
      seq[key].n++;
      if(cur.res==="Whiff") seq[key].whiff++;
      const lbl = zoneLabel(cur.zone);
      seq[key].loc[lbl] = (seq[key].loc[lbl]||0) + 1;
      const isLastPitch = (i === pa.pitches.length-1);
      if(isLastPitch && isOutOutcome(pa.outcome)) seq[key].outEnd++;
    }
  });
  const rows = Object.entries(seq).map(([k,v])=>{
    const topLoc = Object.entries(v.loc).sort((a,b)=>b[1]-a[1])[0];
    return {
      key:k, n:v.n, whiffPct: Math.round(v.whiff/v.n*100), outPct: Math.round(v.outEnd/v.n*100),
      topLoc: topLoc?topLoc[0]:"—", topLocPct: topLoc?Math.round(topLoc[1]/v.n*100):0
    };
  });
  const qualified = rows.filter(r=>r.n>=minN).sort((a,b)=>b.n-a.n);
  const stock = qualified.length ? qualified[0] : null;
  const bestOut = qualified.length ? qualified.slice().sort((a,b)=>b.outPct-a.outPct)[0] : null;
  return {stock, bestOut, all: qualified};
}
function handednessBlockHTML(sa){
  if(!sa.all.length) return '<p class="note">Not enough same-handedness PAs logged yet.</p>';
  const stockLine = sa.stock ? `<span class="badge">Stock: ${esc(sa.stock.key)} (n=${sa.stock.n})</span>` : "";
  const outLine = sa.bestOut ? `<span class="badge">Best out-creator: ${esc(sa.bestOut.key)} (${sa.bestOut.outPct}% out rate, n=${sa.bestOut.n})</span>` : "";
  return `<div class="badgebar" style="margin-bottom:10px">${stockLine}${outLine}</div>`;
}

let trendChart = null;
function buildReportFromPayload(payload){
  const pitcher = payload.pitcher;
  const outings = (payload.outings || []).slice().sort((a,b)=> a.date<b.date?-1:1);
  if(!outings.length){
    document.getElementById("report").innerHTML = '<div class="empty">No outings logged for this pitcher yet.</div>';
    return;
  }
  const CACHE = payload.pitches || {}; // outing_id -> pitches[]

  let allPAs = [];
  outings.forEach(o=> allPAs = allPAs.concat(buildPAs(CACHE[o.id]||[])));
  const allRows = [];
  outings.forEach(o=> (CACHE[o.id]||[]).forEach(r=>allRows.push(r)));

  const codes = [...new Set(allRows.map(p=>p.pitch))];
  const totalPitches = allRows.length;
  const strikes = allRows.filter(p=>["Called","Whiff","Foul","InPlay"].includes(p.result)).length;

  const usage = codes.map(code=>{
    const ps = allRows.filter(p=>p.pitch===code);
    const inZone = ps.filter(p=>p.zone>=1&&p.zone<=9).length;
    const outZone = ps.filter(p=>p.zone>=11&&p.zone<=14).length;
    const swings = ps.filter(p=>["Whiff","Foul","InPlay"].includes(p.result)).length;
    const whiffs = ps.filter(p=>p.result==="Whiff").length;
    const chaseSw = ps.filter(p=>p.zone>=11&&p.zone<=14&&["Whiff","Foul","InPlay"].includes(p.result)).length;
    const velos = ps.map(p=>p.velo).filter(v=>v!=null);
    const avgV = velos.length ? (velos.reduce((a,b)=>a+b,0)/velos.length) : null;
    return {code, n:ps.length, pct: Math.round(ps.length/totalPitches*100),
      zonePct: ps.length?Math.round(inZone/ps.length*100):0,
      whiffPct: swings? Math.round(whiffs/swings*100):null,
      chasePct: outZone? Math.round(chaseSw/outZone*100):null,
      avgV: avgV!=null? avgV.toFixed(1):"—"};
  }).sort((a,b)=>b.n-a.n);

  const outPAs = allPAs.filter(pa=>isOutOutcome(pa.outcome));
  const outByPitch = {};
  outPAs.forEach(pa=>{ const last = pa.pitches[pa.pitches.length-1]; outByPitch[last.pitch]=(outByPitch[last.pitch]||0)+1; });
  const topOutPitch = Object.entries(outByPitch).sort((a,b)=>b[1]-a[1])[0];
  const dpCount = allPAs.filter(pa=>pa.outcome==="DP").length;
  const kCount = allPAs.filter(pa=>pa.outcome==="K (swinging)"||pa.outcome==="K (looking)").length;

  const paPitches = [];
  allPAs.forEach(pa=>pa.pitches.forEach(p=>paPitches.push(p)));
  const twoStrikePitches = paPitches.filter(p=>p._sBefore===2);
  const putAway = codes.map(code=>{
    const ps = twoStrikePitches.filter(p=>p.pitch===code);
    const wh = ps.filter(p=>p.res==="Whiff").length;
    return {code, n:ps.length, pct: ps.length? Math.round(wh/ps.length*100):null};
  }).filter(r=>r.n>0).sort((a,b)=>b.pct-a.pct);

  const contact = battedBallProfile(allRows, codes);
  const twoStrikePaths = pathsToTwoStrikes(allPAs).filter(p=>p.n>=3).slice(0,6);
  const seqVsL = sequenceAnalysis(allPAs.filter(pa=>pa.hand==="L"), 3);
  const seqVsR = sequenceAnalysis(allPAs.filter(pa=>pa.hand==="R"), 3);

  const seq = {};
  allPAs.forEach(pa=>{
    for(let i=1;i<pa.pitches.length;i++){
      const prev = pa.pitches[i-1].pitch, cur = pa.pitches[i];
      const key = prev+" → "+cur.pitch;
      if(!seq[key]) seq[key] = {n:0, whiff:0, loc:{}};
      seq[key].n++;
      if(cur.res==="Whiff") seq[key].whiff++;
      const lbl = zoneLabel(cur.zone);
      seq[key].loc[lbl] = (seq[key].loc[lbl]||0) + 1;
    }
  });
  const bestSeq = Object.entries(seq).filter(([k,v])=>v.n>=4)
    .sort((a,b)=> (b[1].whiff/b[1].n)-(a[1].whiff/a[1].n)).slice(0,5);
  bestSeq.forEach(([k,v])=>{
    const topLoc = Object.entries(v.loc).sort((a,b)=>b[1]-a[1])[0];
    v.topLoc = topLoc ? topLoc[0] : "—";
  });

  const firstDate = outings[0].date, lastDate = outings[outings.length-1].date;
  const level = outings[outings.length-1].level || pitcher.level || "";

  document.getElementById("report").innerHTML = `
    <div class="head">
      <div class="kicker">Swirvin Analytics</div>
      <h1>${esc(pitcher.name)}</h1>
      <div class="meta">${esc(level)} · ${outings.length} outing${outings.length===1?"":"s"} tracked · ${esc(firstDate)} – ${esc(lastDate)}</div>
      <div class="asof">Compiled ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</div>
    </div>

    <div class="section">
      <h2>Overview</h2>
      <div class="kpis">
        <div class="kpi"><div class="v">${totalPitches}</div><div class="k">Pitches logged</div></div>
        <div class="kpi"><div class="v">${totalPitches?Math.round(strikes/totalPitches*100):0}%</div><div class="k">Strike rate</div></div>
        <div class="kpi"><div class="v">${kCount}</div><div class="k">Strikeouts</div></div>
        <div class="kpi"><div class="v">${dpCount}</div><div class="k">Double plays</div></div>
      </div>
    </div>

    <div class="section">
      <h2>Arsenal</h2>
      <table><thead><tr><th>Pitch</th><th>Usage</th><th>Zone%</th><th>Whiff%</th><th>Chase%</th><th>Avg Velo</th></tr></thead>
      <tbody>${usage.map(u=>`<tr><td>${esc(u.code)}</td><td>${u.pct}%</td><td>${u.zonePct}%</td>
        <td>${u.whiffPct==null?"—":u.whiffPct+"%"}</td><td>${u.chasePct==null?"—":u.chasePct+"%"}</td><td>${u.avgV}</td></tr>`).join("")}</tbody></table>
    </div>

    <div class="section">
      <h2>Put-away pitch (2-strike whiff rate)</h2>
      ${putAway.length? `<table><thead><tr><th>Pitch</th><th>Thrown</th><th>Whiff%</th></tr></thead>
      <tbody>${putAway.slice(0,5).map(u=>`<tr><td>${esc(u.code)}</td><td>${u.n}</td><td>${u.pct==null?"—":u.pct+"%"}</td></tr>`).join("")}</tbody></table>`
      : '<p class="note">Not enough 2-strike data yet.</p>'}
      ${topOutPitch?`<p class="note">Primary out pitch: <b>${esc(topOutPitch[0])}</b> (${topOutPitch[1]} outs/strikeouts finished with it).</p>`:""}
    </div>

    <div class="section">
      <h2>Contact quality</h2>
      ${contact.length? `<table><thead><tr><th>Pitch</th><th>BIP</th><th>GB%</th><th>LD%</th><th>FB%</th><th>PU%</th><th>Hard%</th><th>Out%</th></tr></thead>
      <tbody>${contact.map(c=>`<tr><td>${esc(c.code)}</td><td>${c.n}</td><td>${c.gbPct}%</td><td>${c.ldPct}%</td><td>${c.fbPct}%</td><td>${c.puPct}%</td><td>${c.hardPct}%</td><td>${c.outPct}%</td></tr>`).join("")}</tbody></table>`
      : '<p class="note">No balls in play logged yet.</p>'}
    </div>

    <div class="section">
      <h2>Signature sequences &amp; location</h2>
      ${bestSeq.length? `<div class="badgebar">${bestSeq.map(([k,v])=>`<span class="badge">${esc(k)} → ${esc(v.topLoc)} · ${Math.round(v.whiff/v.n*100)}% whiff (n=${v.n})</span>`).join("")}</div>`
      : '<p class="note">Not enough repeated sequences yet to surface a signature combo.</p>'}
    </div>

    <div class="section">
      <h2>Paths to two strikes</h2>
      ${twoStrikePaths.length? `<table><thead><tr><th>Path</th><th>N</th><th>K%</th><th>Avg PA length</th></tr></thead>
      <tbody>${twoStrikePaths.map(p=>`<tr><td>${esc(p.path)}</td><td>${p.n}</td><td>${p.kPct}%</td><td>${p.avgLen}</td></tr>`).join("")}</tbody></table>`
      : '<p class="note">Not enough PAs reached two strikes yet.</p>'}
    </div>

    <div class="section">
      <h2>Vs. left-handed batters</h2>
      ${handednessBlockHTML(seqVsL)}
    </div>

    <div class="section">
      <h2>Vs. right-handed batters</h2>
      ${handednessBlockHTML(seqVsR)}
    </div>

    <div class="section">
      <h2>Whiff% trend</h2>
      <select id="trendPitch" onchange="drawTrend()" style="max-width:160px;padding:8px;border:1px solid #8a6a1f;border-radius:6px;font-family:'JetBrains Mono',monospace;background:#f4ead4;color:#241812">
        ${codes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}
      </select>
      <div class="chartwrap"><canvas id="trendCanvas"></canvas></div>
    </div>

    <div class="foot">Compiled from self-charted video data · Swirvin Analytics · Private coaching report</div>
  `;

  window._REPORT_CACHE = CACHE;
  window._REPORT_OUTINGS = outings;
  drawTrend();
  document.getElementById("printBar").style.display = "flex";
}

function drawTrend(){
  const sel = document.getElementById("trendPitch");
  if(!sel) return;
  const code = sel.value;
  const outings = window._REPORT_OUTINGS, CACHE = window._REPORT_CACHE;
  const labels = [], data = [];
  outings.forEach(o=>{
    const ps = (CACHE[o.id]||[]).filter(p=>p.pitch===code);
    const sw = ps.filter(p=>["Whiff","Foul","InPlay"].includes(p.result)).length;
    const wh = ps.filter(p=>p.result==="Whiff").length;
    if(ps.length){ labels.push(o.date); data.push(sw? Math.round(wh/sw*100):0); }
  });
  const ctx = document.getElementById("trendCanvas");
  if(trendChart) trendChart.destroy();
  if(!ctx || !window.Chart) return;
  trendChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ label: code+" whiff%", data, borderColor:'#8a6a1f', backgroundColor:'rgba(201,162,39,.18)',
      tension:.25, fill:true, pointRadius:3, pointBackgroundColor:'#8a3324' }] },
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y:{ beginAtZero:true, max:100, ticks:{color:'#7a6a52'}, grid:{color:'#c9a86a33'} },
               x:{ ticks:{color:'#7a6a52'}, grid:{color:'#c9a86a22'} } },
      plugins:{ legend:{ display:false } } }
  });
}

boot();
</script>
</body>
</html>
